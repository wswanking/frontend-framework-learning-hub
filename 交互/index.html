function navigation(){const current=route.split('/')[1]?.split('?')[0];$('#nav').innerHTML=navGroups.map(([group,items])=>`<div class="nav-label">${group}</div>${items.map(([path,icon,label])=>link(`<span class="glyph" aria-hidden="true">${iconSvg(path)}</span>${label}${path==='alarms'?`<span class="nav-count">${db.alarms.filter(a=>a.status!=='已解决').length}</span>`:''}`,`/${path}`,current===path?'aria-current="page"':'')).join('')}`).join('');$('#identity').value=db.role}

function askLeave(){return !(dirty||modalDirty)||confirm('有未保存的修改。放弃修改并离开？')}
function go(path,{replace=false,focus=true}={}){if(path===route){if($('#modal').open&&!modalDirty)closeModal();return}if(!askLeave())return;dirty=false;modalDirty=false;forceClose();selected.clear();if(replace)history.replaceState({atlasIndex:historyIndex},'',`#${path}`);else{historyIndex++;history.pushState({atlasIndex:historyIndex},'',`#${path}`)}route=path;scenario='normal';render();closeMenu(false);if(focus)$('#main').focus();window.scrollTo(0,0)}
window.addEventListener('popstate',e=>{if(restoringHistory){restoringHistory=false;return}const next=e.state?.atlasIndex??0;if(!askLeave()){restoringHistory=true;history.go(historyIndex-next);return}historyIndex=next;route=location.hash.slice(1)||'/workspace';dirty=false;modalDirty=false;forceClose();selected.clear();scenario='normal';render();$('#main').focus()});

function header(title,desc,actions=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function panel(title,body,aside=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2>${aside}</div>${body}</section>`}
function table(cols,rows,foot=''){return `<div class="table-hint">左右滑动表格查看更多字段</div><div class="table-wrap" tabindex="0" role="region" aria-label="数据表，可横向滚动"><table><thead><tr>${cols.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(c=>`<tr>${c.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}"><div class="empty"><h2>没有匹配的数据</h2><p>调整筛选条件，或添加第一条记录。</p>${params().has('q')||params().has('status')?btn('清除筛选','clear-filters','small'):''}</div></td></tr>`}</tbody></table></div>${foot?`<div class="table-foot">${foot}</div>`:''}`}
function metrics(items){return `<div class="metric-strip">${items.map(([l,v,m])=>`<div class="metric"><div class="metric-label">${l}</div><div class="metric-value">${v}</div><div class="metric-meta">${m}</div></div>`).join('')}</div>`}
function chart(label='消息吞吐量（模拟）',temp=false){return `<div class="chart" role="img" aria-label="${label}，趋势总体平稳，详细数值见下方数据摘要"><svg viewBox="0 0 640 145" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#6ab5a4" stop-opacity=".20"/><stop offset="100%" stop-color="#6ab5a4" stop-opacity=".01"/></linearGradient></defs><path d="M0 20H640 M0 60H640 M0 100H640 M0 140H640" fill="none" stroke="#e5ecef"/><path d="M0 108L24 103L49 112L75 88L98 93L124 78L148 88L174 67L198 73L224 58L248 67L274 54L298 65L324 48L348 61L374 41L398 49L424 35L448 54L474 29L498 41L524 26L548 39L574 20L598 36L624 23L640 29V140H0Z" fill="url(#area)"/><path d="M0 108L24 103L49 112L75 88L98 93L124 78L148 88L174 67L198 73L224 58L248 67L274 54L298 65L324 48L348 61L374 41L398 49L424 35L448 54L474 29L498 41L524 26L548 39L574 20L598 36L624 23L640 29" fill="none" stroke="#158576" stroke-width="2.5"/><path d="M0 119L60 111L120 115L180 104L240 110L300 95L360 100L420 85L480 91L540 80L600 86L640 75" fill="none" stroke="#668cbd" stroke-width="1.8" stroke-dasharray="5 4"/></svg><div class="chart-axis"><span>08:00</span><span>08:15</span><span>08:30</span><span>08:45</span><span>09:00</span></div></div><div class="table-foot"><span>${temp?'趋势仅为视觉示意；采样读数见时序数据':'摘要：接收 8,420 条 · 转发 7,960 条 · 错误 12 条'}</span><span>固定演示窗口</span></div>`}
function stateView(){if(scenario==='normal')return null;const cfg={loading:['正在加载工作区','壳层保持可用。模拟加载不会自行完成，请结束加载。','结束模拟加载'],empty:['这里还没有数据','当前为评审空状态，不会删除已保存的模拟数据。','返回正常数据'],error:['数据暂时不可用','模拟请求失败 DEMO_TIMEOUT，已保存内容仍保留。','重试'],forbidden:['没有查看权限','当前为权限拒绝示例，不展示受限资源信息。','返回可见页面']}[scenario];return `<section class="panel empty"><div class="empty-icon" aria-hidden="true">${scenario==='error'?'⚠':scenario==='forbidden'?'◇':'◌'}</div><h2>${cfg[0]}</h2><p>${cfg[1]}</p>${scenario==='loading'?'<div class="skeleton"></div><div class="skeleton" style="width:40%"></div>':''}${btn(cfg[2],'normal','primary')}</section>`}
function render(){navigation();const [page,obj]=pathPart();const known=headings[page];const title=known?.[0]||'页面不存在';document.title=`${title} · IoT Atlas 设计评审`;let content;if(!known)content=header('页面不存在','这个地址未包含在设计原型中。')+`<div class="panel empty">${link('返回工作区','/workspace')}</div>`;else if(['tenants','access'].includes(page)&&!can('govern'))content=header(title,known[1])+`<div class="panel empty"><h2>没有治理权限</h2><p>依据现有契约，仅平台管理员可以管理成员、角色与配额。租户管理员在正式版本中的只读治理视图属于后续细化项。</p>${link('返回工作区','/workspace')}</div>`;else content=stateView()||({workspace:workspaceView,devices:()=>obj?deviceView(obj):devicesView(),products:productsView,telemetry:telemetryView,rules:rulesView,alarms:alarmsView,ota:otaView,tenants:tenantsView,access:accessView,connectors:connectorsView,audit:auditView,settings:settingsView,nodes:nodesView,learning:learningView}[page])();$('#main').innerHTML=`<div class="review"><b>DESIGN REVIEW / V3</b><span>独立交互提案 · 数据与操作均为本地模拟</span><label class="state-control">页面状态 <select id="scenario" aria-label="评审页面状态">${[['normal','正常'],['loading','加载'],['empty','空数据'],['error','请求失败'],['forbidden','无权限']].map(([v,l])=>`<option value="${v}" ${scenario===v?'selected':''}>${l}</option>`).join('')}</select></label>${btn('重置演示','reset','small')}</div>${content}<footer class="page-footer"><span>IoT Atlas / 澄海智联 · 离线设计样本</span><span>视觉与新增需求待审核 · 不代表三端实现或生产验收</span></footer>`;if(page==='devices'&&!obj&&$('#device-query')){$('#device-query').value=params().get('q')||'';$('#device-status').value=params().get('status')||''}if(page==='telemetry')drawTelemetry();}
function workspaceView(){const online=db.devices.filter(d=>d.status==='在线').length,open=db.alarms.filter(a=>a.status!=='已解决').length;return `<div class="breadcrumb">运行视图 / WORKSPACE</div>`+header('早上好，开始今天的运行巡检','示例工作区 · 2026 年 10 月 19 日 · 固定演示数据',btn('＋ 注册设备','register','primary'))+metrics([['设备总数',db.devices.length,`${online} 台在线 · ${db.devices.length-online} 台待处理`],['待处理告警',open,'需要确认或跟进的异常'],['接收消息','8,420','本窗口 · 99.86% 成功率'],['进行中升级',db.batches.filter(b=>b.status!=='完成').length,'按批次追踪 · 可恢复失败']])+`<div class="grid">${panel('消息流量',chart(),'<div class="legend"><span>● 接收消息</span><span>┄ 转发消息</span></div>')}${panel('待办队列',`<div class="work-item"><span class="work-icon">!</span><div><h3>${open} 条告警等待处置</h3><p>优先检查冷链设备温度与连接状态</p></div>${link('处理 →','/alarms','class="end"')}</div><div class="work-item"><span class="work-icon blue">↑</span><div><h3>ColdSense 2.3.1 可发布</h3><p>建议先升级少量设备，观察失败原因</p></div>${link('查看 →','/ota','class="end"')}</div><div class="work-item"><span class="work-icon green">◇</span><div><h3>工作区配额健康</h3><p>${db.devices.length} / ${db.quota} 台设备 · 无容量告警</p></div>${link('管理 →','/tenants','class="end"')}</div>`)} </div>`+panel('重点设备',table(['设备 / 标识','状态','产品','最新读数','操作'],db.devices.slice(0,4).map(d=>[link(`<strong>${esc(d.name)}</strong><small class="mono">${d.id}</small>`,`/devices/${d.id}`),tag(d.status),esc(d.product),d.product==='EnergyLink M1'?'2,600 W':`${d.temp} °C`,link('进入详情 →',`/devices/${d.id}`)])),link('所有设备 →','/devices'))+`<div class="grid equal">${panel('连接健康',`<div class="panel-body"><dl class="kv"><dt>MQTT / TLS</dt><dd>${tag('健康','ok')} 华东接入节点</dd><dt>数据转发</dt><dd>${tag('运行中')} HTTP 演示目标</dd><dt>数据时效</dt><dd>固定样例，不连接真实网络</dd></dl></div>`,link('连接与转发 →','/connectors'))}${panel('最近操作',`<div class="panel-body"><ul class="timeline">${db.audit.slice(0,2).map(a=>`<li>${esc(a.action)}<small>${esc(a.time)} · ${esc(a.actor)} · ${esc(a.object)}</small></li>`).join('')}</ul></div>`,link('完整审计 →','/audit'))}</div>`}
function devicesView(){const p=params(),q=(p.get('q')||'').toLowerCase(),status=p.get('status');const rows=db.devices.filter(d=>(!q||[d.name,d.serial,d.id,d.group,d.tags].join(' ').toLowerCase().includes(q))&&(!status||d.status===status));return header(...headings.devices,btn('＋ 注册设备','register','primary'))+`<section class="panel"><form class="filters" id="device-filter"><label>搜索名称、ID、分组或标签<input id="device-query" name="q" placeholder="例如：冷链、DEV-1001"></label><label>连接状态<select id="device-status" name="status"><option value="">全部状态</option><option>在线</option><option>离线</option><option>待接入</option></select></label><button class="primary" type="submit">应用</button>${btn('清除','clear-filters','','type="button"')}</form><div id="bulk" class="bulk"><strong id="selection-count"></strong>${btn('删除所选','bulk-delete','small danger')}<span class="muted">删除不可撤销，将显示影响范围</span></div>${table(['<input class="checkbox" type="checkbox" id="select-all" aria-label="选择当前结果全部设备">','设备 / 序列号','状态','产品','分组 / 标签','固件','操作'],rows.map(d=>[`<input class="checkbox device-check" type="checkbox" value="${d.id}" aria-label="选择 ${esc(d.name)}">`,link(`<strong>${esc(d.name)}</strong><small class="mono">${esc(d.serial)}</small>`,`/devices/${d.id}`,`data-device-link="${d.id}"`),tag(d.status),esc(d.product),`${esc(d.group)}<small>${esc(d.tags)}</small>`,`<span class="mono">${d.version}</span>`,link('查看 →',`/devices/${d.id}`)]),`<span>显示 ${rows.length} / ${db.devices.length} 台设备 · 演示数据全部展示</span><span>筛选条件保存在地址中</span>`)}</section><div class="note">从设备详情可模拟接入上报、查看影子差异、执行命令与诊断。没有真实设备或密钥。</div>`}
function deviceView(deviceId){const d=db.devices.find(x=>x.id===deviceId);if(!d)return header('设备不可用','该对象不存在或已在本地演示中删除。')+link('返回设备列表','/devices');if(d.product==='EnergyLink M1')return meterView(d);const tab=params().get('tab')||'overview';const back=params().get('back')||'/devices';return `<div class="breadcrumb">${link('设备中心',back)} / ${esc(d.id)}</div>`+header(d.name,`${tag(d.status)} <span class="mono">${d.id}</span> · ${esc(d.product)}`,btn('返回列表','device-back')+btn('编辑资料','device-edit','',`data-id="${d.id}"`)+btn('模拟上报','ingest','primary',`data-id="${d.id}"`))+`<div class="tabs">${[['overview','运行概览'],['telemetry','时序数据'],['shadow','设备影子'],['commands','远程命令'],['logs','诊断日志']].map(([v,l])=>link(l,`/devices/${d.id}?tab=${v}&back=${encodeURIComponent(back)}`,`class="${v===tab?'active':''}"`)).join('')}</div><div class="details-content">${tab==='overview'?`<div class="grid">${panel('运行指标',metrics([['温度',d.temp+'°','最新模拟读数'],['上报次数',d.events.length,'本地事件'],['目标温度',d.desired+'°','设备影子 desired'],['连接状态',d.status,'模拟接入']])+chart('设备温度趋势示意',true))}${panel('设备档案',`<div class="panel-body"><dl class="kv"><dt>序列号</dt><dd class="mono">${esc(d.serial)}</dd><dt>所属分组</dt><dd>${esc(d.group)}</dd><dt>标签</dt><dd>${esc(d.tags)}</dd><dt>固件版本</dt><dd>${d.version}</dd><dt>接入身份</dt><dd>DEMO-${d.id}（非密钥）</dd></dl><div class="note">${d.status==='待接入'?'设备已注册，尚未上报。点击“模拟上报”完成接入。':'上报按钮会追加一个确定性读数和诊断事件。'}</div></div>`)}</div>`:tab==='telemetry'?panel('最新采样',chart('设备温度趋势示意',true)+table(['采样时间','温度','数据质量'],samples(d).map(([t,v])=>[t,`${v} °C`,tag('有效','ok')]))):tab==='shadow'?panel('期望与上报状态',`<div class="panel-body"><dl class="kv"><dt>desired.targetTemp</dt><dd>${d.desired} °C</dd><dt>reported.targetTemp</dt><dd>${d.reported} °C</dd><dt>差异</dt><dd>${d.desired===d.reported?tag('已同步','ok'):tag('待同步','warn')}</dd></dl><div class="actions" style="margin-top:22px">${btn('编辑目标温度','shadow-edit','',`data-id="${d.id}"`)}${btn('模拟设备同步','shadow-sync','primary',`data-id="${d.id}"`)}</div><p class="mut function forceClose(){const m=$('#modal');if(m.open)m.close();modalSave=null;modalDirty=false}
function closeModal(){if(modalDirty&&!confirm('有未保存的修改。放弃修改并关闭？'))return;const trigger=modalTrigger;forceClose();if(trigger?.isConnected)trigger.focus();else $('#main').focus()}
function modal(title,body,{save=null,label='保存',drawer=false,dirtyTrack=!!save}={}){const m=$('#modal');if(!m.open)modalTrigger=document.activeElement;modalSave=save;modalDirty=false;m.className=`modal${drawer?' drawer':''}`;m.innerHTML=`<form id="dialog-form"><div class="modal-head"><h2 id="modal-title">${esc(title)}</h2>${btn('×','modal-close','icon','type="button" aria-label="关闭对话框"')}</div><div class="modal-body">${body}<p id="dialog-error" class="error" role="alert"></p></div>${save?`<div class="modal-foot">${btn('取消','modal-close','','type="button"')}<button class="primary" type="submit">${label}</button></div>`:''}</form>`;m.dataset.dirtyTrack=dirtyTrack?'true':'false';if(!m.open)m.showModal();const focus=$('input:not([type=hidden]),select,textarea',m)||$('button',m);focus?.focus()}
function field(label,name,value='',type='text',attrs=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></label>`}
function selectField(label,name,options,value=''){return `<label class="field">${label}<select name="${name}">${options.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`}).join('')}</select></label>`}
function textarea(label,name,value='',attrs=''){return `<label class="field">${label}<textarea name="${name}" rows="3" ${attrs}>${esc(value)}</textarea></label>`}
const error=message=>{const el=$('#dialog-error');if(el)el.textContent=message;else toast(message);return false};
function saved(message){modalDirty=false;forceClose();render();toast(message+'（本地模拟）');if(modalTrigger?.isConnected)modalTrigger.focus();else $('#main').focus()}
function register(){if(!assert('write'))return;modal('注册新设备',`<p>步骤 1 / 2 · 创建设备档案。保存后进入详情，模拟上报完成接入。</p>${field('设备名称 *','name','','text','required maxlength="48" placeholder="例如：冷链温控 · 06"')}${selectField('所属产品 *','product',db.products.map(p=>p.name))}${field('设备序列号 *','serial','','text','required pattern="[A-Za-z0-9_-]{4,40}" placeholder="CH-TEMP-006"')}${selectField('所属分组','group',['华东冷链','华南仓储','华东园区'])}<div class="note">注册只分配 DEMO 身份标识，不生成或展示真实凭据。</div>`,{label:'保存并进入接入',save:f=>{if(!assert('write'))return false;if(db.devices.length>=db.quota)return error('设备配额已用尽，请联系平台管理员调整。');if(db.devices.some(d=>d.serial.toLowerCase()===f.serial.toLowerCase()))return error('此序列号已存在，请使用唯一序列号。');const d={id:id('DEV'),name:f.name.trim(),serial:f.serial,product:f.product,group:f.group,tags:'新设备',status:'待接入',temp:24.6,version:'未安装',reported:22,desired:22,events:['设备档案已创建，等待首次上报']};if(!d.name)return error('设备名称不能仅为空格。');db.devices.push(d);audit('注册设备',d.id);modalDirty=false;forceClose();go(`/devices/${d.id}`);toast('步骤 2 / 2：点击“模拟上报”完成接入。')}})}
function deviceEdit(deviceId){if(!assert('write'))return;const d=db.devices.find(d=>d.id===deviceId);modal('编辑设备资料',field('设备名称 *','name',d.name,'text','required maxlength="48"')+selectField('所属分组','group',['华东冷链','华南仓储','华东园区'],d.group)+field('标签（逗号分隔）','tags',d.tags,'text','maxlength="80"'),{save:f=>{if(!assert('write'))return false;if(!f.name.trim())return error('名称不能为空。');Object.assign(d,{name:f.name.trim(),group:f.group,tags:f.tags});audit('修改设备资料',d.id);saved('设备资料已保存')}})}

function productField(productId){if(!assert('write'))return;const p=db.products.find(p=>p.id===productId);modal('新增物模型属性',field('属性标识符 *','name','','text','required pattern="[a-zA-Z][a-zA-Z0-9_]{1,30}" placeholder="batteryLevel"')+selectField('类型','type',['float','integer','boolean','string'])+field('单位','unit','','text','maxlength="12"'),{label:'添加属性',save:f=>{if(!assert('write'))return false;if(p.fields.some(x=>x.name===f.name))return error('属性标识符已存在。');p.fields.push(f);audit('新增物模型属性',p.id+'/'+f.name);modalDirty=false;productDetail(p.id);toast('属性已添加（本地模拟）')}})}
function ruleCreate(){if(!assert('write'))return;modal('创建温度阈值规则',field('规则名称 *','name','','text','required maxlength="50"')+`<div class="form-grid">${selectField('监测属性','property',[['temperature','温度 temperature']])}${field('触发阈值 °C *','threshold','30','number','required min="-40" max="120" step="0.1"')}</div><div class="note">作用于 ColdSense T200 设备；当温度大于阈值时创建待确认告警。</div>`,{label:'创建并启用',save:f=>{if(!assert('write'))return false;if(!f.name.trim())return error('规则名称不能为空。');const r={id:id('RUL'),name:f.name.trim(),threshold:Number(f.threshold),enabled:true};db.rules.push(r);audit('创建规则',r.id);saved('规则已创建并启用')}})}
function ruleTest(ruleId){if(!assert('operate'))return;const r=db.rules.find(r=>r.id===ruleId);if(!r.enabled){toast('规则已停用，请先启用后试运行。');return}modal('模拟规则输入',`<p>${esc(r.name)} · 触发条件：温度 > ${r.threshold} °C</p>${selectField('设备','device',db.devices.filter(d=>d.product==='ColdSense T200').map(d=>[d.id,d.name]))}${field('模拟温度 °C *','temp',String(r.threshold+2),'number','required min="-40" max="120" step="0.1"')}`,{label:'运行一次',save:f=>{if(!assert('operate'))return false;const d=db.devices.find(d=>d.id===f.device);if(!d)return error('没有兼容设备，请先注册 ColdSense T200。');const temp=Number(f.temp);d.temp=temp;d.events.push(`规则试运行输入 ${temp}°C`);let a;if(temp>r.threshold){a={id:id('ALM'),name:r.name,device:d.id,status:'待确认',owner:'未分配',note:`温度 ${temp}°C，高于阈值 ${r.threshold}°C`,history:[`${new Date().toLocaleTimeString()} 规则 ${r.id} 触发告警`]};db.alarms.unshift(a)}audit('规则试运行',r.id);saved(a?'条件命中，已创建待确认告警':'条件未命中，没有创建告警');if(a)go('/alarms')}})}

function alarmAck(alarmId){if(!assert('operate'))return;const a=db.alarms.find(a=>a.id===alarmId);modal('确认并分派告警',selectField('负责人 *','owner',db.members.filter(m=>m.status==='已加入').map(m=>m.name))+textarea('初步处理说明 *','note','','required minlength="3" maxlength="200"'),{label:'确认告警',save:f=>{if(!assert('operate'))return false;a.owner=f.owner;a.status='已确认';a.history.push(`${f.owner} 确认告警：${f.note}`);audit('确认告警',a.id);saved('告警已确认');alarmDetail(a.id)}})}
function alarmResolve(alarmId){if(!assert('operate'))return;const a=db.alarms.find(a=>a.id===alarmId);modal('解决告警',`<p>对象：${esc(a.id)} · ${esc(a.name)}。解决后此事件只读保留。</p>`+textarea('解决原因 *','note','','required minlength="5" maxlength="300" placeholder="说明根因与恢复措施"'),{label:'确认解决',save:f=>{if(!assert('operate'))return false;a.status='已解决';a.history.push(`已解决：${f.note}`);audit('解决告警',a.id);saved('告警已解决');alarmDetail(a.id)}})}
function otaCreate(){if(!assert('write'))return;const compatible=db.devices.filter(d=>d.product==='ColdSense T200');modal('创建升级批次',field('批次名称 *','name','冷链稳定性更新','text','required maxlength="50"')+selectField('目标固件','firmware',[['FW-231','ColdSense T200 · 2.3.1']])+`<fieldset style="border:1px solid var(--line);border-radius:6px;padding:12px"><legend>兼容设备 · 选择发布范围</legend>${compatible.map(d=>`<label class="field"><span><input type="checkbox" name="target" value="${d.id}" ${d.status==='在线'?'checked':'disabled'}> ${esc(d.name)} · ${esc(d.version)} · ${d.status}</span></label>`).join('')}</fieldset><div class="note warn">本稿仅选择在线设备；离线排队策略待设计。创建后进入待执行状态。本模拟在第一次推进时让最后一台设备校验超时，便于审核恢复流程。</div>`,{label:'确认范围并创建',save:(f,form)=>{if(!assert('write'))return false;const targets=[...new FormData(form).getAll('target')];if(!targets.length)return error('至少选择一台在线兼容设备。');if(targets.some(target=>!db.devices.some(d=>d.id===target&&d.product==='ColdSense T200'&&d.status==='在线')))return error('范围中包含不可用设备，请重新选择。');if(!f.name.trim())return error('批次名称不能为空。');const b={id:id('OTA'),name:f.name.trim(),version:'2.3.1',status:'待执行',targets:targets.map(device=>({device,status:'等待',attempts:0,reason:''})),history:['创建批次，已确认 '+targets.length+' 台设备']};db.batches.unshift(b);audit('创建 OTA 批次',b.id);saved('升级批次已创建');otaDetail(b.id)}})}
function otaDetail(batchId){const b=db.batches.find(b=>b.id===batchId);const success=b.targets.filter(t=>t.status==='成功').length;modal(b.name,`<div class="pill-line">${tag(b.status)}<span class="mono">${b.id}</span></div><p>固件 2.3.1 · 仅针对已确认的 ${b.targets.length} 台 ColdSense T200</p><strong>${success} / ${b.targets.length} 完成</strong><div class="progress"><span style="width:${success/b.targets.length*100}%"></span></div>${table(['设备','结果 / 原因','尝试'],b.targets.map(t=>[esc(t.device),`${tag(t.status,t.status==='成功'?'ok':t.status==='失败'?'bad':'info')}<small>${esc(t.reason)}</small>`,t.attempts]))}<div class="actions" style="margin:20px 0">${['待执行','运行中','重试中'].includes(b.status)?btn(b.status==='待执行'?'开始模拟升级':'推进模拟进度','ota-advance','primary',`type="button" data-id="${b.id}"`):b.status==='部分失败'?btn('仅重试失败设备','ota-retry','primary',`type="button" data-id="${b.id}"`):''}</div><h3>执行记录</h3><ul class="timeline">${b.history.map(h=>`<li>${esc(h)}</li>`).join('')}</ul><div class="note">进度由审核者显式推进，不代表后台实时任务；原成功设备不会被重试。</div>`,{drawer:true})}
function otaAdvance(batchId){const b=db.batches.find(b=>b.id===batchId);if(!assert(b.status==='重试中'?'operate':'write'))return;if(b.status==='待执行'){b.status='运行中';b.targets.forEach(t=>{t.status='下载中';t.attempts=1});b.history.push('开始模拟下载，尝试次数 +1')}else if(b.status==='运行中'){b.targets.forEach((t,i)=>{t.status=i===b.targets.length-1?'失败':'成功';t.reason=t.status==='失败'?'校验响应超时 DEMO_TIMEOUT':'';if(t.status==='成功'){const d=db.devices.find(d=>d.id===t.device);if(d)d.version=b.version}});b.status='部分失败';b.history.push('首次执行结束，1 台校验超时')}else if(b.status==='重试中'){b.targets.filter(t=>t.status==='重试中').forEach(t=>{t.status='成功';t.reason='';const d=db.devices.find(d=>d.id===t.device);if(d)d.version=b.version});b.status='完成';b.history.push('失败设备重试成功；未重复执行成功设备')}else return;audit('推进 OTA 模拟',b.id);render();otaDetail(b.id)}
function otaRetry(batchId){if(!assert('operate'))return;const b=db.batches.find(b=>b.id===batchId),failed=b.targets.filter(t=>t.status==='失败');modal('仅重试失败设备',`<p>将重试 ${failed.length} 台设备：${failed.map(t=>esc(t.device)).join('、')}。已成功的 ${b.targets.length-failed.length} 台设备保持不变。</p>`+textarea('重试原因 *','reason','','required minlength="5" maxlength="200" placeholder="例如：已恢复网络并检查固件完整性"'),{label:'确认重试',save:f=>{if(!assert('operate'))return false;failed.forEach(t=>{t.status='重试中';t.attempts++});b.status='重试中';b.history.push('发起重试：'+f.reason);audit('仅重试失败 OTA',b.id);saved('失败设备已进入重试');otaDetail(b.id)}})}
function memberInvite(){if(!assert('govern'))return;modal('邀请工作区成员',field('姓名 *','name','','text','required maxlength="30"')+field('演示邮箱 *','email','','email','required placeholder="name@example.invalid"')+selectField('角色','role',['运维工程师','数据观察员','租户管理员'])+`<div class="note">保存一条邀请记录，不发送任何邮件。</div>`,{label:'创建模拟邀请',save:f=>{if(!assert('govern'))return false;if(db.members.some(m=>m.email===f.email))return error('该邮箱已存在，请勿重复邀请。');db.members.push({id:id('MEM'),...f,status:'已邀请'});audit('邀请成员',f.email);saved('模拟邀请记录已创建')}})}
function memberRole(memberId){if(!assert('govern'))return;const m=db.members.find(m=>m.id===memberId);if(m.role==='平台管理员'){toast('平台管理员是固定演示身份，不在本稿中降级。');return}modal('分配成员角色',`<p>${esc(m.name)} · ${esc(m.email)}</p>`+selectField('新角色','role',['租户管理员','运维工程师','数据观察员'],m.role)+`<div class="note warn">权限变更只影响此模拟成员记录，不会改变右上角当前操作者身份。</div>`,{label:'确认角色变更',save:f=>{if(!assert('govern'))return false;m.role=f.role;audit('变更成员角色',m.id);saved('成员角色已更新')}})}
function quotaEdit(){if(!assert('govern'))return;modal('调整设备配额',`<p>当前已使用 ${db.devices.length} 台设备。配额不得小于实际用量。</p>`+field('设备配额 *','quota',String(db.quota),'number','required min="1" max="100000" step="1"'),{label:'保存配额',save:f=>{if(!assert('govern'))return false;if(Number(f.quota)<db.devices.length)return error(`配额不能低于当前用量 ${db.devices.length}。`);db.quota=Number(f.quota);audit('调整设备配额',String(db.quota));saved('配额已更新')}})}
function bulkDelete(){if(!assert('write'))return;if(!selected.size)return;const ids=[...selected];modal('确认删除设备',`<div class="note warn">将永久删除本地演示中的 ${ids.length} 台设备。此操作不可撤销。</div><p>${ids.map(esc).join('、')}</p><p>关联告警与升级历史保留对象 ID；详情将显示对象不可用。</p>`+field('输入 DELETE 确认 *','confirmation','','text','required pattern="DELETE" autocomplete="off"'),{label:'删除 '+ids.length+' 台设备',save:f=>{if(!assert('write'))return false;if(f.confirmation!=='DELETE')return error('请输入 DELETE。');db.devices=db.devices.filter(d=>!selected.has(d.id));audit('批量删除设备',ids.join(','));selected.clear();saved('所选设备已删除')}})}
function search(){modal('搜索工作区',`<label class="field">搜索页面、设备或规则<input id="global-query" placeholder="输入名称或 ID，例如：冷链" autocomplete="off"></label><div id="global-results"></div>`);searchResults('')}
function searchResults(q){const terms=q.toLowerCase();const results=[...Object.entries(headings).map(([p,[n]])=>[n,'页面',`/${p}`]),...db.devices.map(d=>[d.name+' '+d.id,'设备',`/devices/${d.id}`]),...db.rules.map(r=>[r.name,'规则','/rules'])].filter(([n])=>n.toLowerCase().includes(terms)).slice(0,8);$('#global-results').innerHTML=results.length?results.map(([n,t,p])=>link(`${esc(n)} <small class="muted">${t}</small>`,p,'class="search-result"')).join(''):'<p>没有找到匹配结果。试试设备名称、ID 或模块名。</p>'}
function notifications(){modal('通知中心',db.prefs.inapp?`<div class="work-item"><div><h3>现场异常需要处理</h3><p>${db.alarms.filter(a=>a.status!=='已解决').length} 条未关闭告警</p>${link('前往告警中心 →','/alarms')}</div></div><div class="work-item"><div><h3>新固件已加入演示目录</h3><p>ColdSense T200 · 2.3.1</p>${link('查看固件与 OTA →','/ota')}</div></div>`:'<p>工作区通知已关闭。可到设置页面开启。</p>'+link('前往设置','/settings'),{drawer:true})}
function reset(){modal('重置本地演示',`<p>清除本原型中新建的设备、规则、告警、OTA、成员及日志，恢复固定样例。正式三端应用的数据不受影响。</p>`,{label:'确认重置',dirtyTrack:false,save:()=>{db=seed();persist();scenario='normal';dirty=false;saved('演示已重置');go('/workspace')}})}
function exportTelemetry(){const rows=telemetryRows();const csv='\ufeff时间,温度°C,质量\n'+rows.map(([t,v])=>`${t},${v},有效`).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='iot-atlas-demo-telemetry.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('当前查询结果已导出 CSV（模拟数据）。')}
const actions={
'menu':()=>{$('#sidebar').inert=false;$('#sidebar').classList.add('open');$('#menu-toggle').setAttribute('aria-expanded','true');$('.mobile-close').focus()},'menu-close':()=>closeMenu(),
'modal-close':closeModal,normal:()=>{scenario='normal';render()},reset,register,'device-edit':deviceEdit,
'device-back':()=>{const back=params().get('back')||'/devices',trigger=lastDeviceTrigger;go(back);const el=trigger&&$(`[data-device-link="${trigger}"]`);if(el)el.focus()},
'clear-filters':()=>go('/'+pathPart()[0]),'bulk-delete':bulkDelete,'product-detail':productDetail,'product-field':productField,
'filter-apply':()=>{},'rule-create':ruleCreate,'rule-test':ruleTest,
'rule-toggle':ruleId=>{if(!assert('write'))return;const r=db.rules.find(r=>r.id===ruleId);r.enabled=!r.enabled;audit(r.enabled?'启用规则':'停用规则',r.id);render();toast('规则状态已更新（本地模拟）。')},
'ingest':deviceId=>{if(!assert('operate'))return;const d=db.devices.find(d=>d.id===deviceId);d.status='在线';d.temp=Number((d.temp+.2).toFixed(1));d.events.push(`模拟上报成功 · ${d.temp}°C`);audit('设备模拟上报',d.id);render();toast('设备已在线，上报数据已追加（本地模拟）。')},
'shadow-edit':deviceId=>{if(!assert('operate'))return;const d=db.devices.find(d=>d.id===deviceId);modal('编辑目标温度',field('targetTemp °C *','temp',d.desired,'number','required min="-20" max="50" step="0.5"'),{save:f=>{if(!assert('operate'))return false;d.desired=Number(f.temp);audit('更新设备影子',d.id);saved('目标温度已保存，等待设备同步')}})},
'shadow-sync':deviceId=>{if(!assert('operate'))return;const d=db.devices.find(d=>d.id===deviceId);if(d.status!=='在线'){toast('设备不在线，先模拟上报恢复连接。');return}d.reported=d.desired;d.events.push('设备影子已同步');audit('同步设备影子',d.id);render();toast('reported 已与 desired 同步（本地模拟）。')},
'command':deviceId=>{if(!assert('operate'))return;const d=db.devices.find(d=>d.id===deviceId);if(d.status!=='在线'){toast('离线设备无法执行命令，请先恢复连接。');return}modal('确认重启设备',`<p>目标：${esc(d.name)} / ${d.id}。重启可能中断连接。本演示将立即返回模拟成功回执。</p>`,{label:'确认模拟重启',dirtyTrack:false,save:()=>{if(!assert('operate'))return false;d.events.push('命令 reboot · 模拟回执 SUCCESS');audit('发送模拟重启',d.id);saved('设备返回模拟成功回执')}})},
'alarm-detail':alarmDetail,'alarm-ack':alarmAck,'alarm-resolve':alarmResolve,'ota-create':otaCreate,'ota-detail':otaDetail,'ota-advance':otaAdvance,'ota-retry':otaRetry,

};
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button){e.preventDefault();actions[button.dataset.action]?.(button.dataset.id);return}const a=e.target.closest('a[href^="#/"]');if(a&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&!e.altKey){e.preventDefault();let path=a.getAttribute('href').slice(1);if(a.dataset.deviceLink){lastDeviceTrigger=a.dataset.deviceLink;path+=`?back=${encodeURIComponent(route)}`}go(path)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,data=Object.fromEntries(new FormData(f));if(f.id==='dialog-form'){if(!f.reportValidity())return;modalSave?.(data,f)}else if(f.id==='device-filter'){const p=new URLSearchParams();if(data.q.trim())p.set('q',data.q.trim());if(data.status)p.set('status',data.status);go('/devices'+(p.size?'?'+p:''))}else if(f.id==='telemetry-filter')go('/telemetry?'+new URLSearchParams(data));else if(f.id==='audit-filter')go('/audit'+(data.q?'?q='+encodeURIComponent(data.q):''));else if(f.id==='prefs-form'){if(!assert('govern'))return;db.prefs={inapp:!!data.inapp,email:!!data.email};dirty=false;audit('保存通知偏好','工作区');toast('偏好已保存（本地模拟）。')}});
document.addEventListener('input',e=>{if(e.target.id==='global-query')searchResults(e.target.value);else if(e.target.closest('#modal')&&$('#modal').dataset.dirtyTrack==='true')modalDirty=true;else if(e.target.closest('#prefs-form'))dirty=true});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){if(!askLeave()){e.target.value=scenario;return}dirty=false;scenario=e.target.value;render()}else if(e.target.id==='identity'){if(!askLeave()){e.target.value=db.role;return}dirty=false;forceClose();db.role=e.target.value;persist();render();toast('当前模拟身份：'+roleNames[db.role])}else if(e.target.matches('.device-check')){e.target.checked?selected.add(e.target.value):selected.delete(e.target.value);updateSelection()}else if(e.target.id==='select-all'){$$('.device-check').forEach(c=>{c.checked=e.target.checked;e.target.checked?selected.add(c.value):selected.delete(c.value)});updateSelection()}else if(e.target.closest('#modal')&&$('#modal').dataset.dirtyTrack==='true')modalDirty=true});
function updateSelection(){const b=$('#bulk');b?.classList.toggle('show',selected.size>0);if($('#selection-count'))$('#selection-count').textContent=`已选择 ${selected.size} 台`;const boxes=$$('.device-check');if($('#select-all')){$('#select-all').checked=boxes.length>0&&boxes.every(c=>c.checked);$('#select-all').indeterminate=selected.size>0&&selected.size<boxes.length}}
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&$('#modal').open){const items=$$('a[href],button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]',$('#modal')).filter(el=>el.getClientRects().length);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();return}if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();return}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#modal').open)search()}if(e.key==='Escape'&&$('#sidebar').classList.contains('open'))closeMenu();if(e.key==='Tab'&&$('#sidebar').classList.contains('open')){const items=$$('button,a', $('#sidebar')),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('resize',()=>{if(innerWidth>1050){$('#sidebar').inert=false;$('#sidebar').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false')}else if(!$('#sidebar').classList.contains('open'))$('#sidebar').inert=true});
if(innerWidth<=1050)$('#sidebar').inert=true;render();
