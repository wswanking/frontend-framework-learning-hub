<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IoT Atlas · 框架入口</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #071d2b; color: #e9f9ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1.5rem; }
    main { width: min(54rem, 100%); }
    h1 { margin: 0 0 0.5rem; font-size: clamp(2rem, 6vw, 3.5rem); color: #65e2f7; }
    p { margin: 0 0 2rem; color: #a5c4d2; }
    nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    a { display: grid; gap: 0.4rem; min-height: 9rem; padding: 1.3rem; border: 1px solid #2c6883; border-radius: 0.75rem; color: #e9f9ff; background: #103248; text-decoration: none; }
    a:hover, a:focus-visible { border-color: #5bdaf1; outline: 2px solid #5bdaf1; outline-offset: 2px; }
    strong { font-size: 1.45rem; }
    small { color: #b6d0db; }
    @media (width <= 620px) { nav { grid-template-columns: 1fr; } a { min-height: 6rem; } }
  </style>
</head>
<body>
  <main>
    <h1>IoT Atlas</h1>
    <p>选择一个框架进入应用。</p>
    <nav aria-label="框架应用入口">
      <a id="react" href="http://127.0.0.1:14101/dashboard"><strong>React</strong><small>进入 React 应用</small></a>
      <a id="vue" href="http://127.0.0.1:14102/dashboard"><strong>Vue</strong><small>进入 Vue 应用</small></a>
      <a id="angular" href="http://127.0.0.1:14103/dashboard"><strong>Angular</strong><small>进入 Angular 应用</small></a>
    </nav>
  </main>
  <script>
    for (const [name, port] of [['react', 14101], ['vue', 14102], ['angular', 14103]]) {
      document.getElementById(name).href = `${location.protocol}//${location.hostname}:${port}/dashboard`;
    }
  </script>
</body>
</html>
