name: Independent diagnostics and browser checks
on:
  push:
    paths: ['code/apps/**', 'tools/**', 'docs/**', 'index.html', 'README.md', 'AGENTS.md', '.github/workflows/diagnostics.yml']
  pull_request:
    paths: ['code/apps/**', 'tools/**', 'docs/**', 'index.html', 'README.md', 'AGENTS.md', '.github/workflows/diagnostics.yml']
  workflow_dispatch:
    inputs:
      visual:
        description: Run reviewed visual acceptance (fails when baseline is pending)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: node --test tools/tests/*.test.mjs
  diagnostics:
    name: ${{ matrix.framework }} — isolated build and behavior
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [react, vue, angular]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: code/apps/${{ matrix.framework }}/package-lock.json
      - name: Copy only this project outside the repository
        run: cp -R code/apps/${{ matrix.framework }} "$RUNNER_TEMP/atlas-app"
      - run: npm ci
        working-directory: ${{ runner.temp }}/atlas-app
      - name: No-browser diagnostics and production build
        id: diagnose
        run: npm run diagnose
        working-directory: ${{ runner.temp }}/atlas-app
      - name: Fingerprint build before browser execution
        run: node tools/artifacts.mjs snapshot ${{ matrix.framework }} "$RUNNER_TEMP/atlas-app" "$RUNNER_TEMP/tested-app"
      - run: npx playwright install --with-deps chromium
        working-directory: ${{ runner.temp }}/atlas-app
      - name: Browser behavior and accessibility
        id: browser
        run: npm run test:e2e
        working-directory: ${{ runner.temp }}/atlas-app
      - name: Seal the exact browser-tested files
        run: node tools/artifacts.mjs seal "$RUNNER_TEMP/atlas-app" "$RUNNER_TEMP/tested-app"
      - name: Candidate screenshots (not design approval)
        id: candidate
        run: npm run visual:capture
        working-directory: ${{ runner.temp }}/atlas-app
      - name: V2 business candidates (not design approval)
        id: v2
        run: npm run capture:v2
        working-directory: ${{ runner.temp }}/atlas-app
      - name: Read visual review state
        id: visual
        working-directory: ${{ runner.temp }}/atlas-app
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('tests/visual/baseline-review.json','utf8')); const approved=r.platforms.linux?.status==='approved'; fs.appendFileSync(process.env.GITHUB_OUTPUT,'approved='+approved+'\n'); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,approved?'Visual baseline present; comparison required.\n':'VISUAL_PENDING: diagnostic behavior only; candidate screenshots are not design acceptance.\n');"
      - name: Reviewed visual acceptance
        id: visual_acceptance
        if: ${{ steps.visual.outputs.approved == 'true' || (github.event_name == 'workflow_dispatch' && inputs.visual) }}
        run: npm run test:visual
        working-directory: ${{ runner.temp }}/atlas-app
      - name: Upload independently tested package
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ matrix.framework }}
          path: ${{ runner.temp }}/tested-app/
          if-no-files-found: error
          retention-days: 14
      - name: Record commit-linked diagnostic evidence
        if: always()
        working-directory: ${{ runner.temp }}/atlas-app
        env:
          ATLAS_APP: ${{ matrix.framework }}
          ATLAS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATLAS_DIAGNOSE: ${{ steps.diagnose.outcome }}
          ATLAS_BROWSER: ${{ steps.browser.outcome }}
          ATLAS_CANDIDATE: ${{ steps.candidate.outcome }}
          ATLAS_V2: ${{ steps.v2.outcome }}
          ATLAS_VISUAL: ${{ steps.visual_acceptance.outcome }}
        run: node "$GITHUB_WORKSPACE/tools/write-ci-evidence.mjs"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.framework }}-${{ runner.os }}
          path: ${{ runner.temp }}/atlas-app/reports/
          if-no-files-found: warn
          retention-days: 14
  tested-candidate:
    name: Assemble tested bytes without rebuilding
    needs: [tooling, diagnostics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          path: ${{ runner.temp }}/packages
      - name: Verify provenance, compare domain exports and assemble
        run: >-
          node tools/artifacts.mjs assemble "$RUNNER_TEMP/candidate"
          "$RUNNER_TEMP/packages/tested-react"
          "$RUNNER_TEMP/packages/tested-vue"
          "$RUNNER_TEMP/packages/tested-angular"
      - name: Upload same-build candidate (no release approval)
        uses: actions/upload-artifact@v4
        with:
          name: browser-tested-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14
